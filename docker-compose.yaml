# The service and nothing else.
#
# No reverse proxy, no labels, no external network: which proxy sits in front, what the host
# is called and which network it lives on are properties of a deployment, not of the product.
# They belong in `docker-compose.override.yaml`, which is gitignored and exists only on the
# machine that runs it. The example in the README shows what one looks like behind Traefik.
services:
  zaezd:
    build: .
    image: zaezd:latest
    restart: unless-stopped
    # Everything the process reads is documented in .env.example. `.env` is not committed.
    env_file:
      - .env
    environment:
      PORT: 8080
    # Published locally by default, so `docker compose up` gives a working screen with no proxy
    # in front. A deployment behind one usually drops this and joins the proxy's network instead.
    ports:
      - '127.0.0.1:8080:8080'
