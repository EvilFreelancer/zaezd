# Deployment behind Traefik. The names differ between installations - one calls its TLS
# entrypoint `websecure`, another `https` - so they are variables with the values this
# deployment actually uses. Anything else host-specific belongs in docker-compose.override.yaml,
# which is gitignored.
services:
  zaezd:
    build: .
    image: zaezd:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      ZAEZD_MODE: ${ZAEZD_MODE:-live}
      ZAEZD_PUBLIC_URL: ${ZAEZD_PUBLIC_URL:-https://zaezd.rpa.icu}
    labels:
      traefik.enable: "true"
      traefik.http.routers.zaezd.rule: Host(`${ZAEZD_HOST:-zaezd.rpa.icu}`)
      traefik.http.routers.zaezd.entrypoints: ${ZAEZD_ENTRYPOINT:-https}
      traefik.http.routers.zaezd.tls: "true"
      traefik.http.routers.zaezd.tls.certresolver: ${ZAEZD_CERTRESOLVER:-letsencrypt}
      traefik.docker.network: ${ZAEZD_NETWORK:-traefik}
      traefik.http.services.zaezd.loadbalancer.server.port: "8080"
    networks:
      - traefik

networks:
  traefik:
    name: ${ZAEZD_NETWORK:-traefik}
    external: true
